app:
  description: 'Docker MCP Gateway経由でPlantUML MCPサーバーを評価するためのサンプルチャットアプリです。作りたい図を自然言語（日本語）で説明すると、エージェントがPlantUMLソースを生成し、MCPツール
    render_png（既定）/ render_svg でPNGまたはSVGにレンダリングして返します。シーケンス図・クラス図・ユースケース図・アクティビティ図・状態遷移図・コンポーネント図・ER図・ガントチャート・マインドマップなどに対応。レンダリングエラー時はエラーメッセージを読み取ってソースを修正し、最大3回まで自動リトライします。'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: plantuml-mit eval
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - remote_url
      - local_file
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 3
    opening_statement: 'こんにちは！PlantUML作図アシスタントです 📊


      作りたい図の内容を日本語で説明していただければ、PlantUMLでダイアグラムを作成してSVG（またはPNG）でお返しします。


      対応している図：シーケンス図・クラス図・ユースケース図・アクティビティ図・状態遷移図・コンポーネント図・ER図・ガントチャート・マインドマップ など


      例：「ユーザーがログインしてトークンを受け取るまでのシーケンス図を作って」のように話しかけてください。図の種類を指定しなくても、内容から最適な形式を選びます。


      ※現在、図の中のラベルは英語で生成されます（日本語フォント対応は準備中です）

      '
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - ユーザーがログインして認証トークンを受け取るまでのシーケンス図を作って
    - ECサイトの注文・支払い・配送のクラス図を作って
    - 会員登録から退会までの状態遷移図を作って
    - Webアプリの承認ワークフローをアクティビティ図にして
    - ブログシステムのER図を作って（ユーザー、記事、コメント、タグ）
    - マイクロサービス構成のコンポーネント図をPNGで作って
    - 新機能リリースまでの2週間のガントチャートを作って
    - 「プロジェクト管理」をテーマにマインドマップを作って
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
