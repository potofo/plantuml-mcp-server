# CI: verifies that the Maven build and the Docker image build succeed
# on every push and pull request. No image is published here — publishing
# happens only in the tag-driven release workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven build and test
        run: mvn -q package

      - name: Docker build (single arch, no push)
        run: docker build -t plantuml-mcp:ci .

      - name: Acceptance tests (EARS requirements, see test/ACCEPTANCE.md)
        run: IMAGE=plantuml-mcp:ci bash test/acceptance-test.sh | tee acceptance-tap.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            acceptance-tap.txt
            test/RESULTS.md
