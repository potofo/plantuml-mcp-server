# Release workflow: triggered by pushing a "v*" tag (e.g. v0.1.0).
#
# 1. Builds a multi-arch (amd64/arm64) image
# 2. Pushes it to GHCR under this repository's owner — the image name is
#    derived from ${{ github.repository }}, so forks work without editing
#    this file (images go to the fork owner's GHCR)
# 3. Generates a digest-pinned catalog.yaml and attaches it to a GitHub
#    Release — import it with: docker mcp catalog import ./catalog.yaml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate digest-pinned catalog.yaml
        run: |
          cat > catalog.yaml <<EOF
          # Custom catalog for Docker MCP Gateway.
          # Generated by the release workflow for ${GITHUB_REF_NAME}.
          # Usage:
          #   docker mcp catalog import ./catalog.yaml
          version: 2
          name: plantuml-custom
          displayName: PlantUML Custom Catalog
          registry:
            plantuml:
              title: PlantUML
              type: server
              image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
              description: Render PlantUML source to SVG or PNG through Model Context Protocol.
              longLived: false
              tools:
                - name: render_svg
                - name: render_png
          EOF
          cat catalog.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: catalog.yaml
          generate_release_notes: true
